name: Resumen para YouTube (videos de 10 min)

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      url:
        description: "Link del directo terminado o de la grabación (Kick, Twitch, YouTube, Google Drive, Dropbox)"
        required: true
      parts:
        description: "Cuántos videos"
        default: "1"
      minutes:
        description: "Minutos de cada video"
        default: "10"
      topic:
        description: "Juego o tema (vacío = GTA 6)"
        default: ""
      mine:
        description: "Es mío o tengo permiso (subir a YouTube como privado)"
        type: boolean
        default: false
      share:
        description: "Crear link de descarga para compartir (72 h)"
        type: boolean
        default: false
      intro:
        description: "Link de tu intro (opcional)"
        default: ""
      issue:
        description: "(interno) Issue donde responder"
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: resumen
  cancel-in-progress: false

jobs:
  aprobacion:
    # Pedido de otra persona: queda en espera hasta que el dueño le ponga la etiqueta "aprobado"
    if: github.event_name == 'issues' && github.event.action == 'opened' && (github.event.issue.user.login != github.repository_owner || contains(github.event.issue.title, '[externo]')) && startsWith(github.event.issue.title, '[resumen]')
    runs-on: ubuntu-24.04
    steps:
      - name: Avisar que espera aprobación
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          N: ${{ github.event.issue.number }}
        run: |
          gh label create pendiente -R "$REPO" --color FBCA04 --description "Pedido externo esperando aprobación" 2>/dev/null || true
          gh label create aprobado -R "$REPO" --color 0E8A16 --description "El dueño aprobó este pedido" 2>/dev/null || true
          gh issue edit "$N" -R "$REPO" --add-label pendiente
          gh issue comment "$N" -R "$REPO" --body "Recibido 🙌 Este bot es privado: tu pedido queda **en espera** hasta que el dueño lo apruebe. Cuando lo apruebe empiezo y te dejo aquí el link de descarga."

  resumen:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'opened' && github.event.issue.user.login == github.repository_owner && !contains(github.event.issue.title, '[externo]') && startsWith(github.event.issue.title, '[resumen]')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'aprobado' && github.event.sender.login == github.repository_owner &&
       (github.event.issue.user.login != github.repository_owner || contains(github.event.issue.title, '[externo]')) && startsWith(github.event.issue.title, '[resumen]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: "1"
      ISSUE_NUM: ${{ github.event.issue.number || github.event.inputs.issue }}
      BOT_EXTERNO: ${{ github.event_name == 'issues' && (github.event.issue.user.login != github.repository_owner || contains(github.event.issue.title, '[externo]')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg
        run: which ffmpeg || (timeout 600 sudo apt-get -o Acquire::Retries=3 update -qq && timeout 600 sudo apt-get install -y -qq ffmpeg)
      - name: Fuente Poppins (si falta)
        run: |
          if [ ! -f assets/fonts/Poppins-Bold.ttf ]; then
            mkdir -p assets/fonts
            curl -sSL -o assets/fonts/Poppins-Bold.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf
          fi
      - name: Instalar dependencias
        run: pip install -r requirements.txt && pip install -U yt-dlp
      - name: Cache del modelo Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models-v1
      - name: Leer el link
        id: args
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          IN_URL: ${{ github.event.inputs.url }}
          IN_PARTS: ${{ github.event.inputs.parts }}
          IN_MINUTES: ${{ github.event.inputs.minutes }}
          IN_TOPIC: ${{ github.event.inputs.topic }}
          IN_MINE: ${{ github.event.inputs.mine }}
          IN_SHARE: ${{ github.event.inputs.share }}
          IN_INTRO: ${{ github.event.inputs.intro }}
        run: python scripts/leer_resumen.py >> "$GITHUB_OUTPUT"
      - name: Avisar en el Issue que empezó
        if: env.ISSUE_NUM != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment "$ISSUE_NUM" --body "Recibido ✅ Estoy armando ${{ steps.args.outputs.parts }} video(s) de ~${{ steps.args.outputs.minutes }} min con los mejores momentos. Te aviso aquí cuando estén."
      - name: Armar el resumen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          URL: ${{ steps.args.outputs.url }}
          PARTS: ${{ steps.args.outputs.parts }}
          MINUTES: ${{ steps.args.outputs.minutes }}
          TOPIC: ${{ steps.args.outputs.topic }}
          MINE: ${{ steps.args.outputs.mine }}
          SHARE: ${{ steps.args.outputs.share }}
          INTRO: ${{ steps.args.outputs.intro }}
        run: |
          EXTRA=""
          if [ "$MINE" = "true" ] && [ "$BOT_EXTERNO" != "true" ]; then EXTRA="--mine"; fi
          if [ "$SHARE" = "true" ] || [ "$BOT_EXTERNO" = "true" ]; then EXTRA="$EXTRA --share"; fi
          if [ -n "$INTRO" ]; then EXTRA="$EXTRA --intro $INTRO"; fi
          python -m bot.resumen "$URL" --parts "$PARTS" --minutes "$MINUTES" ${TOPIC:+--topic "$TOPIC"} $EXTRA
      - name: Guardar historial
        if: always()
        run: |
          git config user.name "gta6-bot"
          git config user.email "gta6-bot@users.noreply.github.com"
          git add data/published.json
          if ! git diff --cached --quiet; then
            cp data/published.json /tmp/mio.json
            git commit -q -m "Historial: resumen"
            for i in 1 2 3 4; do
              git fetch -q origin main && git reset -q --hard origin/main
              python scripts/unir_historial.py /tmp/mio.json data/published.json
              git add data/published.json
              git diff --cached --quiet && break
              git commit -q -m "Historial: resumen" && git push -q && break
              sleep 7
            done
          fi
      - name: Responder en el Issue
        if: always() && env.ISSUE_NUM != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$BOT_EXTERNO" = "true" ] && [ -f out/live_summary.md ]; then
            python scripts/compartir_externo.py
            gh issue comment "$ISSUE_NUM" --body-file out/externo.md
            gh issue edit "$ISSUE_NUM" --remove-label pendiente || true
            gh issue close "$ISSUE_NUM" || true
          elif [ -f out/live_summary.md ]; then
            gh issue comment "$ISSUE_NUM" --body-file out/live_summary.md
            gh issue close "$ISSUE_NUM" || true
          else
            gh issue comment "$ISSUE_NUM" --body "❌ No pude armar el resumen con ese link. Detalles: $RUN_URL"
          fi
