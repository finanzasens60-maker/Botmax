name: GTA 6 Shorts automáticos

on:
  schedule:
    # Horas en UTC. Colombia = UTC-5  ->  8:17, 13:17 y 19:17 hora Colombia
    - cron: "17 13 * * *"
    - cron: "47 16 * * *"
    - cron: "17 20 * * *"
    - cron: "17 0 * * *"
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano
    inputs:
      dry_run:
        description: "Solo generar (no publicar)"
        type: boolean
        default: false
      count:
        description: "Cuántos videos generar"
        default: "1"
      mode:
        description: "news = noticias · tips = trucos y curiosidades"
        type: choice
        options: ["news", "tips"]
        default: "news"
      solo_descargar:
        description: "Solo dejarlos para descargar (no subir a YouTube)"
        type: boolean
        default: false

permissions:
  contents: write   # guardar historial y crear Releases con los MP4
  models: read      # IA gratis de GitHub Models para los guiones

concurrency:
  group: gta6-bot
  cancel-in-progress: false

jobs:
  make-short:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: "1"   # ver el progreso en vivo en los registros
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg y voz de respaldo
        run: |
          which ffmpeg || (timeout 600 sudo apt-get -o Acquire::Retries=3 update -qq && timeout 600 sudo apt-get install -y -qq ffmpeg)
          which espeak-ng || timeout 300 sudo apt-get install -y -qq --no-install-recommends espeak-ng || echo "sin espeak (no es obligatorio)"

      - name: Fuente Poppins (si falta)
        run: |
          if [ ! -f assets/fonts/Poppins-Bold.ttf ]; then
            mkdir -p assets/fonts
            curl -sSL -o assets/fonts/Poppins-Bold.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf
          fi

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Cache de capturas de Rockstar
        uses: actions/cache@v4
        with:
          path: assets/rockstar
          key: rockstar-imgs-v1

      - name: Crear video(s) y publicar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COUNT: ${{ github.event.inputs.count }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MODE: ${{ github.event.inputs.mode }}
          SOLO_DESCARGAR: ${{ github.event.inputs.solo_descargar }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          DRY=""
          if [ "$DRY_RUN" = "true" ]; then DRY="--dry-run"; fi
          # Programados: 8:17 am y 3:17 pm = noticias · 11:47 am y 7:17 pm = trucos y curiosidades
          if [ "$SCHEDULE" = "47 16 * * *" ] || [ "$SCHEDULE" = "17 0 * * *" ]; then MODE="tips"; fi
          if [ "$MODE" = "tips" ]; then
            EXTRA=""
            if [ "$SOLO_DESCARGAR" = "true" ]; then EXTRA="--no-youtube"; fi
            python -m bot.tips --count "${COUNT:-1}" $DRY $EXTRA || { [ -n "$SCHEDULE" ] && python -m bot.main --count 1 $DRY; }
          else
            python -m bot.main --count "${COUNT:-1}" $DRY
          fi

      - name: Guardar historial (para no repetir noticias)
        if: always()
        run: |
          git config user.name "gta6-bot"
          git config user.email "gta6-bot@users.noreply.github.com"
          git add data/published.json
          git diff --cached --quiet || (git commit -m "Historial: nuevo Short publicado" && (git pull --rebase && git push))
