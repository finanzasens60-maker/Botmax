name: Clips de directos

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      url:
        description: "Link del directo o VOD (Twitch, Kick, YouTube…)"
        required: true
      start:
        description: "Solo VOD: desde qué minuto (ej. 1:20:00). Vacío = desde el inicio"
        default: ""
      minutes:
        description: "Solo VOD: cuántos minutos analizar. Vacío = 120"
        default: ""
      hours:
        description: "Si está EN VIVO: cuántas horas grabar (vacío = 24)"
        default: ""
      topic:
        description: "Juego o tema del directo (vacío = GTA 6)"
        default: ""
      mine:
        description: "El directo es mío o tengo permiso (subir a YouTube)"
        type: boolean
        default: false
      issue:
        description: "(interno) número del Issue para ir respondiendo"
        default: ""

permissions:
  contents: write
  issues: write
  models: read
  actions: write   # para encadenar ejecuciones en directos de muchas horas

concurrency:
  group: directos
  cancel-in-progress: false

jobs:
  aprobacion:
    # Pedido de otra persona: queda en espera hasta que el dueño le ponga la etiqueta "aprobado"
    if: github.event_name == 'issues' && github.event.action == 'opened' && (github.event.issue.user.login != github.repository_owner || contains(github.event.issue.title, '[externo]')) && contains(github.event.issue.body, 'http') && !startsWith(github.event.issue.title, '[resumen]') && !startsWith(github.event.issue.title, '[tiktok]')
    runs-on: ubuntu-24.04
    steps:
      - name: Avisar que espera aprobación
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          N: ${{ github.event.issue.number }}
        run: |
          gh label create pendiente -R "$REPO" --color FBCA04 --description "Pedido externo esperando aprobación" 2>/dev/null || true
          gh label create aprobado -R "$REPO" --color 0E8A16 --description "El dueño aprobó este pedido" 2>/dev/null || true
          gh issue edit "$N" -R "$REPO" --add-label pendiente
          gh issue comment "$N" -R "$REPO" --body "Recibido 🙌 Este bot es privado: tu pedido queda **en espera** hasta que el dueño lo apruebe. Cuando lo apruebe empiezo y te dejo aquí el link de descarga."

  clips:
    # Solo el dueño del repo puede mandar links
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'opened' && github.event.issue.user.login == github.repository_owner && !contains(github.event.issue.title, '[externo]') && contains(github.event.issue.body, 'http') && !startsWith(github.event.issue.title, '[resumen]') && !startsWith(github.event.issue.title, '[tiktok]')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'aprobado' && github.event.sender.login == github.repository_owner &&
       (github.event.issue.user.login != github.repository_owner || contains(github.event.issue.title, '[externo]')) && contains(github.event.issue.body, 'http') && !startsWith(github.event.issue.title, '[resumen]') && !startsWith(github.event.issue.title, '[tiktok]'))
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: "1"   # ver el progreso en vivo en los registros
      ISSUE_NUM: ${{ github.event.issue.number || github.event.inputs.issue }}
      BOT_EXTERNO: ${{ github.event_name == 'issues' && (github.event.issue.user.login != github.repository_owner || contains(github.event.issue.title, '[externo]')) }}
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg
        run: |
          which ffmpeg || (timeout 600 sudo apt-get -o Acquire::Retries=3 update -qq && timeout 600 sudo apt-get install -y -qq ffmpeg)
          which espeak-ng || timeout 300 sudo apt-get install -y -qq --no-install-recommends espeak-ng || echo "sin espeak (no es obligatorio)"

      - name: Fuente Poppins (si falta)
        run: |
          if [ ! -f assets/fonts/Poppins-Bold.ttf ]; then
            mkdir -p assets/fonts
            curl -sSL -o assets/fonts/Poppins-Bold.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf
          fi

      - name: Instalar dependencias
        run: pip install -r requirements.txt && pip install -U yt-dlp

      - name: Cache del modelo Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models-v1

      - name: Leer el link
        id: args
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          IN_URL: ${{ github.event.inputs.url }}
          IN_START: ${{ github.event.inputs.start }}
          IN_MINUTES: ${{ github.event.inputs.minutes }}
          IN_HOURS: ${{ github.event.inputs.hours }}
          IN_MINE: ${{ github.event.inputs.mine }}
          IN_TOPIC: ${{ github.event.inputs.topic }}
        run: python scripts/leer_issue.py >> "$GITHUB_OUTPUT"

      - name: Avisar en el Issue que empezó
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment "$ISSUE_NUM" --body "Recibido ✅ Estoy procesando el directo. Si está en vivo, lo grabo por bloques de 1 hora y te voy dejando los clips aquí."

      - name: Sacar clips
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          URL: ${{ steps.args.outputs.url }}
          START: ${{ steps.args.outputs.start }}
          MINUTES: ${{ steps.args.outputs.minutes }}
          HOURS: ${{ steps.args.outputs.hours }}
          MINE: ${{ steps.args.outputs.mine }}
          TOPIC: ${{ steps.args.outputs.topic }}
        run: |
          EXTRA=""
          if [ "$MINE" = "true" ] && [ "$BOT_EXTERNO" != "true" ]; then EXTRA="--mine"; fi
          if [ "$BOT_EXTERNO" = "true" ] && [ -z "$START$MINUTES" ]; then MINUTES=120; fi  # externos: solo un tramo, sin grabar en vivo
          if [ -n "$START$MINUTES" ]; then
            # VOD con tramo específico
            python -m bot.live "$URL" ${START:+--start "$START"} ${MINUTES:+--minutes "$MINUTES"} ${TOPIC:+--topic "$TOPIC"} $EXTRA
          else
            # En vivo: maratón por bloques (o VOD completo si no está en vivo)
            python -m bot.maraton "$URL" ${HOURS:+--hours "$HOURS"} ${TOPIC:+--topic "$TOPIC"} ${ISSUE_NUM:+--issue "$ISSUE_NUM"} $EXTRA
          fi

      - name: Guardar historial
        if: always()
        run: |
          git config user.name "gta6-bot"
          git config user.email "gta6-bot@users.noreply.github.com"
          git add data/published.json
          if ! git diff --cached --quiet; then
            cp data/published.json /tmp/mio.json
            git commit -q -m "Historial: clips de directo"
            # Mientras se grababa, otros jobs pudieron cambiar el historial: se unen ambos sin conflicto
            for i in 1 2 3 4; do
              git fetch -q origin main && git reset -q --hard origin/main
              python scripts/unir_historial.py /tmp/mio.json data/published.json
              git add data/published.json
              git diff --cached --quiet && break
              git commit -q -m "Historial: clips de directo" && git push -q && break
              sleep 7
            done
          fi

      - name: Responder en el Issue
        if: always() && env.ISSUE_NUM != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$BOT_EXTERNO" = "true" ] && [ -f out/live_summary.md ]; then
            python scripts/compartir_externo.py
            gh issue comment "$ISSUE_NUM" --body-file out/externo.md
            gh issue edit "$ISSUE_NUM" --remove-label pendiente || true
            gh issue close "$ISSUE_NUM"
          elif [ -f out/live_summary.md ]; then
            gh issue comment "$ISSUE_NUM" --body-file out/live_summary.md
            if [ ! -f out/continua ]; then gh issue close "$ISSUE_NUM"; fi
          else
            gh issue comment "$ISSUE_NUM" --body "❌ No pude sacar clips de ese link. Detalles: $RUN_URL"
          fi
