name: Clips de directos

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      url:
        description: "Link del directo o VOD (Twitch, Kick, YouTube…)"
        required: true
      start:
        description: "Desde qué minuto (ej. 1:20:00). Vacío = desde el inicio"
        default: ""
      minutes:
        description: "Cuántos minutos analizar"
        default: "120"
      mine:
        description: "El directo es mío o tengo permiso (subir a YouTube)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  models: read

concurrency:
  group: gta6-bot
  cancel-in-progress: false

jobs:
  clips:
    # Solo el dueño del repo puede mandar links
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.user.login == github.repository_owner && contains(github.event.issue.body, 'http'))
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng

      - name: Fuente Poppins (si falta)
        run: |
          if [ ! -f assets/fonts/Poppins-Bold.ttf ]; then
            mkdir -p assets/fonts
            curl -sSL -o assets/fonts/Poppins-Bold.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf
          fi

      - name: Instalar dependencias
        run: pip install -r requirements.txt && pip install -U yt-dlp

      - name: Cache del modelo Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models-v1

      - name: Leer el link
        id: args
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          IN_URL: ${{ github.event.inputs.url }}
          IN_START: ${{ github.event.inputs.start }}
          IN_MINUTES: ${{ github.event.inputs.minutes }}
          IN_MINE: ${{ github.event.inputs.mine }}
        run: python scripts/leer_issue.py >> "$GITHUB_OUTPUT"

      - name: Avisar en el Issue que empezó
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment ${{ github.event.issue.number }} --body "Recibido ✅ Estoy procesando el directo. Te aviso aquí cuando los clips estén listos (puede tardar 20-60 min)."

      - name: Sacar clips
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          URL: ${{ steps.args.outputs.url }}
          START: ${{ steps.args.outputs.start }}
          MINUTES: ${{ steps.args.outputs.minutes }}
          MINE: ${{ steps.args.outputs.mine }}
        run: |
          EXTRA=""
          if [ "$MINE" = "true" ]; then EXTRA="--mine"; fi
          python -m bot.live "$URL" ${START:+--start "$START"} ${MINUTES:+--minutes "$MINUTES"} $EXTRA

      - name: Guardar historial
        if: always()
        run: |
          git config user.name "gta6-bot"
          git config user.email "gta6-bot@users.noreply.github.com"
          git add data/published.json
          git diff --cached --quiet || (git commit -m "Historial: clips de directo" && (git pull --rebase && git push))

      - name: Responder en el Issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f out/live_summary.md ]; then
            gh issue comment ${{ github.event.issue.number }} --body-file out/live_summary.md
            gh issue close ${{ github.event.issue.number }}
          else
            gh issue comment ${{ github.event.issue.number }} --body "❌ No pude sacar clips de ese link. Detalles: $RUN_URL"
          fi

      - name: Subir clips como artefacto (respaldo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ github.run_number }}
          path: |
            out/**/clip*.mp4
            out/**/clip*_publicar.txt
          retention-days: 7
          if-no-files-found: ignore
