name: Clips virales de Kick (clips del público)

on:
  schedule:
    # Mientras dure un directo largo (ver kick_auto en config.yaml): cada 4 horas saca los clips nuevos del público
    - cron: "23 */4 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Canal de Kick (ej. westcol)"
        default: "westcol"
      vod:
        description: "Link del VOD de Kick (kick.com/canal/videos/...) o id del directo"
        required: true
      count:
        description: "Cuántos clips sacar"
        default: "25"
      skip:
        description: "Saltar los N más vistos (si ya se usaron en otra tanda)"
        default: "0"
      issue:
        description: "Issue donde responder (opcional)"
        default: ""
      subir_youtube:
        description: "Subirlos a YouTube como PRIVADOS"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: kick-clips
  cancel-in-progress: false

jobs:
  clips:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg
        run: which ffmpeg || (timeout 600 sudo apt-get -o Acquire::Retries=3 update -qq && timeout 600 sudo apt-get install -y -qq ffmpeg)
      - name: Fuente Poppins (si falta)
        run: |
          if [ ! -f assets/fonts/Poppins-Bold.ttf ]; then
            mkdir -p assets/fonts
            curl -sSL -o assets/fonts/Poppins-Bold.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf
          fi
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Cache del modelo Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models-v1
      - name: Sacar clips virales
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IN_CHANNEL: ${{ github.event.inputs.channel }}
          IN_VOD: ${{ github.event.inputs.vod }}
          IN_COUNT: ${{ github.event.inputs.count }}
          IN_SKIP: ${{ github.event.inputs.skip }}
          IN_ISSUE: ${{ github.event.inputs.issue }}
          IN_YOUTUBE: ${{ github.event.inputs.subir_youtube == 'true' && '1' || '0' }}
          IN_MAXYT: "6"
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Programado: solo si hay un directo activo en kick_auto (config.yaml) y no ha pasado su fecha límite
            eval "$(python scripts/kick_auto.py)"
            if [ "$ACTIVO" != "1" ]; then echo "No hay directo largo activo en kick_auto: nada que hacer."; exit 0; fi
            IN_VOD=live; IN_SKIP=0
          fi
          echo "$IN_ISSUE" > /tmp/issue_num
          YT=""
          if [ "$IN_YOUTUBE" = "1" ]; then YT="--youtube --max-youtube $IN_MAXYT"; fi
          python -m bot.kickclips "$IN_CHANNEL" --vod "$IN_VOD" --count "$IN_COUNT" --skip "$IN_SKIP" --pool $(( IN_COUNT * 2 )) $YT
      - name: Guardar historial
        if: always()
        run: |
          git config user.name "gta6-bot"
          git config user.email "gta6-bot@users.noreply.github.com"
          git add data/published.json
          if ! git diff --cached --quiet; then
            cp data/published.json /tmp/mio.json
            git commit -q -m "Historial: clips virales de Kick"
            for i in 1 2 3 4; do
              git fetch -q origin main && git reset -q --hard origin/main
              python scripts/unir_historial.py /tmp/mio.json data/published.json
              git add data/published.json
              git diff --cached --quiet && break
              git commit -q -m "Historial: clips virales de Kick" && git push -q && break
              sleep 7
            done
          fi
      - name: Responder en el Issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N=$(cat /tmp/issue_num 2>/dev/null || true)
          [ -n "$N" ] && [ -f out/live_summary.md ] && gh issue comment "$N" --body-file out/live_summary.md || true
