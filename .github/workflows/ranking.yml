name: Ranking diario - Lo más viral de GTA 6

on:
  schedule:
    # 5:37 pm hora Colombia (22:37 UTC), todos los días
    - cron: "37 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo generar (no publicar)"
        type: boolean
        default: false
      solo_descargar:
        description: "No subir a YouTube (solo dejarlo para descargar)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gta6-bot
  cancel-in-progress: false

jobs:
  ranking:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg y voz de respaldo
        run: |
          which ffmpeg || (timeout 600 sudo apt-get -o Acquire::Retries=3 update -qq && timeout 600 sudo apt-get install -y -qq ffmpeg)
          which espeak-ng || timeout 300 sudo apt-get install -y -qq --no-install-recommends espeak-ng || echo "sin espeak"
      - name: Fuente Poppins (si falta)
        run: |
          if [ ! -f assets/fonts/Poppins-Bold.ttf ]; then
            mkdir -p assets/fonts
            curl -sSL -o assets/fonts/Poppins-Bold.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf
          fi
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Cache del modelo Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models-v1
      - name: Hacer el ranking y publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          SOLO_DESCARGAR: ${{ github.event.inputs.solo_descargar }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then ARGS="--dry-run"; fi
          if [ "$SOLO_DESCARGAR" = "true" ]; then ARGS="$ARGS --no-youtube"; fi
          python -m bot.ranking $ARGS
      - name: Guardar historial
        if: always()
        run: |
          git config user.name "gta6-bot"
          git config user.email "gta6-bot@users.noreply.github.com"
          git add data/published.json
          if ! git diff --cached --quiet; then
            cp data/published.json /tmp/mio.json
            git commit -q -m "Historial: ranking diario"
            for i in 1 2 3 4; do
              git fetch -q origin main && git reset -q --hard origin/main
              python scripts/unir_historial.py /tmp/mio.json data/published.json
              git add data/published.json
              git diff --cached --quiet && break
              git commit -q -m "Historial: ranking diario" && git push -q && break
              sleep 7
            done
          fi
