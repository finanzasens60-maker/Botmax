name: Probar voces

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voces:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - run: pip install -r requirements.txt
      - run: python scripts/probar_voces.py
      - uses: actions/upload-artifact@v4
        with:
          name: muestras-de-voz
          path: muestras/*.mp3
          retention-days: 7
