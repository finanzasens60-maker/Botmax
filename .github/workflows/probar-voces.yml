name: Probar voces

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voces:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          which ffmpeg || (timeout 600 sudo apt-get -o Acquire::Retries=3 update -qq && timeout 600 sudo apt-get install -y -qq ffmpeg)
          which espeak-ng || timeout 300 sudo apt-get install -y -qq --no-install-recommends espeak-ng || echo "sin espeak (no es obligatorio)"
      - run: pip install -r requirements.txt
      - run: python scripts/probar_voces.py
      - uses: actions/upload-artifact@v4
        with:
          name: muestras-de-voz
          path: |
            muestras/*.mp3
            muestras/ranking.md
          retention-days: 7
