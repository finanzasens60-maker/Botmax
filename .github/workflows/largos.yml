name: GTA 6 Videos largos automáticos

on:
  schedule:
    # Martes, jueves y sábado a las 15:37 hora Colombia (20:37 UTC)
    - cron: "37 20 * * 2,4,6"
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano
    inputs:
      dry_run:
        description: "Solo generar (no publicar)"
        type: boolean
        default: false
      theme:
        description: "Tema (Trucos, Secretos, Consejos, Resumen semanal). Vacío = rota solo"
        default: ""

permissions:
  contents: write   # guardar historial y crear Releases con los MP4
  models: read      # IA gratis de GitHub Models para los guiones

concurrency:
  group: gta6-bot
  cancel-in-progress: false

jobs:
  make-long:
    runs-on: ubuntu-24.04
    env:
      PYTHONUNBUFFERED: "1"   # ver el progreso en vivo en los registros
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg y voz de respaldo
        run: |
          which ffmpeg || (timeout 600 sudo apt-get -o Acquire::Retries=3 update -qq && timeout 600 sudo apt-get install -y -qq ffmpeg)
          which espeak-ng || timeout 300 sudo apt-get install -y -qq --no-install-recommends espeak-ng || echo "sin espeak (no es obligatorio)"

      - name: Fuente Poppins (si falta)
        run: |
          if [ ! -f assets/fonts/Poppins-Bold.ttf ]; then
            mkdir -p assets/fonts
            curl -sSL -o assets/fonts/Poppins-Bold.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-Bold.ttf
          fi

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Cache de capturas de Rockstar
        uses: actions/cache@v4
        with:
          path: assets/rockstar
          key: rockstar-imgs-v1

      - name: Crear video(s) y publicar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THEME: ${{ github.event.inputs.theme }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          DRY=""
          if [ "$DRY_RUN" = "true" ]; then DRY="--dry-run"; fi
          python -m bot.main --long ${THEME:+--theme "$THEME"} $DRY

      - name: Guardar historial (para no repetir noticias)
        if: always()
        run: |
          git config user.name "gta6-bot"
          git config user.email "gta6-bot@users.noreply.github.com"
          git add data/published.json
          git diff --cached --quiet || (git commit -m "Historial: nuevo video largo" && (git pull --rebase && git push))

      - name: Subir videos como artefacto (respaldo, 7 días)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: largo-${{ github.run_number }}
          path: |
            out/**/video.mp4
            out/**/publicar.txt
            out/**/thumbnail.jpg
          retention-days: 7
          if-no-files-found: ignore
